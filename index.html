<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rocket Run</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050814; font-family: ui-sans-serif, system-ui, sans-serif; }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px 18px; color: #eaf2ff;
    }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .pill {
      background: rgba(10, 18, 40, 0.72); border: 1px solid rgba(140, 180, 255, 0.25);
      backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 14px; font-weight: 650; letter-spacing: 0.02em;
    }
    #overlay {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 30%, rgba(40,70,160,0.35), rgba(0,0,0,0.78));
      color: white; text-align: center; padding: 24px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: clamp(2rem, 6vw, 3.4rem); margin-bottom: 8px; }
    #overlay p { opacity: 0.88; max-width: 28rem; margin: 0 auto 18px; line-height: 1.45; }
    #overlay button {
      pointer-events: auto; cursor: pointer; border: 0; border-radius: 999px;
      padding: 12px 22px; font-size: 1rem; font-weight: 700;
      background: linear-gradient(135deg, #ff5a4e, #ff8a3d); color: #140808;
      box-shadow: 0 10px 30px rgba(255, 90, 78, 0.35);
    }
    .hint { font-size: 0.92rem; opacity: 0.8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="top">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Best: <span id="best">0</span></div>
    </div>
    <div class="hint">← → ↑ ↓ / WASD to fly · grab gold coins · Space to boost</div>
  </div>
  <div id="overlay">
    <div>
      <h1>Rocket Run</h1>
      <p>Fly in 3D (left/right/up/down), dodge asteroids, grab gold coins (+25).</p>
      <button id="startBtn">Launch</button>
      <p id="endMsg" class="hint" style="margin-top:14px"></p>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./game.js"></script>
</body>
</html>
